<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sallee Load Board</title>

  <!-- PWA / "Add to Home Screen" on iOS (and Android) -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#05100b" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Load Board" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #05100b;
      min-height: 100vh;
    }
    #root {
      min-height: 100vh;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.30.0/lib/msal-browser.min.js"></script>
  <script src="bundle.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {
          // non-fatal -- the board still works fully without the service worker,
          // it just won't be installable / offline-resilient
        });
      });
    }
  </script>
</body>
</html>
