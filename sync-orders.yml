name: Sync orders from SharePoint

on:
  schedule:
    # every 5 minutes. GitHub may delay this slightly under load --
    # tighten or loosen to taste (minimum practical interval is ~5 min).
    - cron: "*/5 * * * *"
  workflow_dispatch: {} # lets you trigger a manual sync from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Sync ORDERS from SharePoint
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SP_SHARE_URL: ${{ secrets.SP_SHARE_URL }}
        run: python scripts/sync_orders.py

      - name: Commit updated data if changed
        run: |
          git config user.name "sallee-load-board-bot"
          git config user.email "actions@github.com"
          git add data/orders.json
          if git diff --cached --quiet; then
            echo "No changes to orders.json"
          else
            git commit -m "Sync orders from SharePoint [skip ci]"
            git push
          fi
